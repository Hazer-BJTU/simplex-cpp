<!DOCTYPE html>
<html lang="en" data-theme="light" data-theme-preference="system">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>simplex hub panel</title>
    <script>
        /*
         * The theme, applied before the bundle loads.
         *
         * Without this the panel paints its light background for one frame on
         * every reload for an operator who chose dark — the flash is the whole
         * reason this is inline rather than a module.
         *
         * It duplicates two literals from `src/ui/theme.ts` (the storage key
         * and the attribute names) and nothing else: the resolution rule below
         * is three lines precisely so that "which copy is right?" is not a
         * question worth asking. `panel-theme.test.js` asserts the two agree.
         */
        try {
            var stored = localStorage.getItem('simplex.panel.theme');
            var preference = stored === 'light' || stored === 'dark' ? stored : 'system';
            var dark = preference === 'dark' || (preference === 'system'
                && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme-preference', preference);
        } catch (error) {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
