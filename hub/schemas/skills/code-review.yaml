name: code-review
title: Code review
description: Review changes for correctness, regressions, and missing validation.
keywords: [review, correctness, testing]
text: |
  Review the changes against the user's requirements.
  Prioritize correctness, regressions, and missing validation.
  Explain each actionable finding with its location and impact.
  Distinguish verified findings from questions that need more evidence.
