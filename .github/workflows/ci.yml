# CI — configure, build and run the full test suite in the SAME execution
# context the Docker strategy pins: the ghcr build-base image (g++-14.3.0,
# Boost 1.91.0 shared, OpenSSL, vendored nlohmann/json + yaml-cpp under
# /opt/simplex-thirdparty). Running on the runner's stock toolchain instead
# would split the context (project code vs. Boost built by a different
# compiler) and break the cross-DSO plugin tests' admission gate — the pinned
# image is the point.
#
# The image is pinned by BOTH tag and digest: the tag tracks the version
# (must stay in sync with docker/Dockerfile.build-context's BASE_IMAGE
# default), and the digest makes any change to the reference build
# environment an explicit, reviewable edit — matching how the upstream GCC
# image is itself digest-pinned. When the base image is rebuilt, update the
# digest here (docker buildx imagetools inspect <image> gives it).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: checkout needs contents:read; packages:read is present in
# case the ghcr image is (or becomes) private and pulls use GITHUB_TOKEN.
permissions:
  contents: read
  packages: read

# Every job here is a container job, and a container job's default shell is the
# container's /bin/sh — which is dash on the Debian family and bash on the
# RHEL family. Steps that use bash-isms (set -o pipefail) therefore pass on
# AlmaLinux and die on Ubuntu with "Illegal option -o pipefail", which is a
# distinction no reader should have to hold in their head. Pin the shell once.
#
# Note what that pins it TO: `shell: bash` expands to
# `bash --noprofile --norc -e -o pipefail`, so an early-exiting consumer
# (`ldd --version | head -1`) now charges the producer's SIGPIPE to the
# pipeline — exit 141, a failed step. That is the right default for the steps
# that do real work; a purely cosmetic pipeline trims with `|| true`.
defaults:
  run:
    shell: bash

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/hazer-bjtu/simplex-cpp/build-base:boost1.91-gcc14@sha256:3d900293f8d5baa5bca188b23ae227d499a16ae6460e3ed8d175b77af50ffbc6
      # If the ghcr package is private, uncomment these:
      # credentials:
      #   username: ${{ github.actor }}
      #   password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DSIMPLEX_THIRDPARTY_DIR=/opt/simplex-thirdparty

      - name: Build
        run: cmake --build build -j2

      - name: Test
        # --no-tests=error: registering zero tests must not read as green.
        # --timeout: per-test backstop so a deadlock regression fails in
        # minutes instead of hanging until the 45-minute job timeout.
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120

  # ---------------------------------------------------------------------------
  # hub-test — the Node hub's own suite.
  #
  # It runs OUTSIDE every container above, and that is deliberate: those images
  # pin a C++ execution context (g++ 14.3.0, Boost 1.91, OpenSSL) and contain no
  # Node at all. Installing one would put a second, unrelated toolchain inside
  # the fingerprint the plugin admission gate depends on, and would force a
  # rebuild plus a new digest of two published images. Nothing here needs the
  # C++ tree: the hub's tests drive stand-in workers over real WebSockets.
  #
  # What this job cannot see is whether the hub works against the actual worker.
  # That is hub-e2e, at the end of this file, and it is why the two are not one.
  # ---------------------------------------------------------------------------
  hub-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The floor is not decorative: hub/package.json declares >=20.11, and
        # 20.11 is exactly where import.meta.dirname appeared. Testing only the
        # newest Node would let a newer API in while the declared floor stayed
        # silently false — the same argument as the glibc and OpenSSL floors.
        node: ['20.11', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        working-directory: hub
        # npm ci, not install: package-lock.json is committed, so every
        # dependency is resolved by integrity hash rather than by whatever the
        # registry happens to serve. --ignore-scripts because no step here needs
        # a lifecycle script; the browser the panel job drives is installed
        # explicitly there. No cache step on purpose: caching a tree this size
        # would trade a real failure mode for no measurable time.
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Type check
        # `tsc` runs on the declared floor too: it is a checker, not a builder,
        # so a type that only holds on a newer Node is a real defect and belongs
        # here rather than in the panel job. It is also what keeps the modules
        # that are still `.js` under review while they are migrated.
        working-directory: hub
        run: npm run typecheck

      - name: Test
        # Covers the protocol adapters, the session registry, the supervisor,
        # the panel API, worker-protocol drift against core/docs, and the
        # panel's own asset integrity.
        #
        # On the floor, the one suite that loads a `.ts` module skips itself by
        # name and reason: type stripping needs Node >= 22.18. That skip is
        # honest only while nothing under src/ imports shared/ — the moment
        # something does, this job is the one that will say so.
        working-directory: hub
        run: npm test

  # ---------------------------------------------------------------------------
  # hub-panel — the browser half, which has a different toolchain and a
  # different Node requirement from the hub itself.
  #
  # It is a separate job rather than more steps in the matrix above for two
  # reasons: Vite 8 needs Node >= 20.19 and Vitest 5 needs >= 22.12, both above
  # the hub's declared floor; and installing a browser needs root, which the
  # floor job has no business asking for.
  # ---------------------------------------------------------------------------
  hub-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: hub
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Build the panel
        working-directory: hub
        run: npm run build

      - name: Install the browser
        # --with-deps because the runner image does not carry libnss3 and
        # friends — which is exactly what made the hand-rolled CDP check skip
        # silently on a developer machine instead of failing.
        working-directory: hub
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: hub
        run: npx playwright test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: hub/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # portable-release — the SAME tree, built in the portable base image, plus one
  # check the job above structurally cannot perform.
  #
  # build-test runs in a Debian 13 image (glibc 2.41). Its artifacts load only
  # on Ubuntu 25.04+ / Debian 13+ / Fedora 42+, which is fine for testing
  # in-container and useless for a release. glibc is not forward-compatible, and
  # the floor is a property of the BUILD IMAGE: no compile, link or test failure
  # in the job above can reveal it, because that image's glibc is always new
  # enough. This job builds in the AlmaLinux 9 image (glibc 2.34) and then
  # asserts the resulting artifacts really do stay under that floor
  # (SIMPLEX_GLIBC_FLOOR registers the `portability_floor` ctest; see
  # docker/portability_floor.cmake for what it does and does not prove).
  #
  # Why not just replace build-test with this one: the two images are different
  # execution contexts on purpose. Keeping both means a toolchain-shaped
  # regression that only manifests on one glibc/libstdc++ generation is caught
  # by whichever job sees it, instead of being invisible in a single context.
  # ---------------------------------------------------------------------------
  portable-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      # Pinned by tag and digest for the same reason as build-test above: a
      # change to the reference release environment must be an explicit,
      # reviewable edit. When the base image is rebuilt, update the digest
      # (docker buildx imagetools inspect <image> prints it).
      image: ghcr.io/hazer-bjtu/simplex-cpp/build-portable:glibc2.34-gcc14.3@sha256:0dd632a5fe241db22bac21a600ebc02640049beafad5d34ae049a08215d0206b
      # credentials:
      #   username: ${{ github.actor }}
      #   password: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        # Release only. Debug is already covered in build-test's matrix, and
        # what this job adds is a property of the release artifacts — the floor
        # a Debug build reports is not the one that ships.
        build_type: [Release]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure
        # SIMPLEX_GLIBC_FLOOR must match the base image's glibc (LABEL
        # simplex.build.glibc). SIMPLEX_OPENSSL_FLOOR is 3.0.0 rather than the
        # image's own 3.5.x: the oldest supported target ships OpenSSL 3.0.2,
        # and OpenSSL 3 versions symbols per minor release under one unchanging
        # SONAME, so this is the only place that mismatch is visible.
        # SIMPLEX_STAGING_DIR is what makes SIMPLEX_STRICT_NEEDED mean
        # something — a DT_NEEDED counts as ours only if it is really in the
        # release tree, not merely somewhere under build/.
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSIMPLEX_THIRDPARTY_DIR=/opt/simplex-thirdparty \
            -DSIMPLEX_BUNDLE_RUNTIME=/opt/simplex-runtime \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" \
            -DSIMPLEX_GLIBC_FLOOR=2.34 \
            -DSIMPLEX_OPENSSL_FLOOR=3.0.0 \
            -DSIMPLEX_STRICT_NEEDED=ON \
            -DSIMPLEX_STAGING_DIR="$PWD/stage"

      - name: Build
        run: cmake --build build -j2

      - name: Stage the release
        # Before ctest, because the floor test scans the staging tree: it is
        # where the bundled runtime lives and where "shipped by us" is decided.
        run: cmake --install build

      - name: Assert the release carries the tools' declarations
        # The process tools are DECLARED in YAML files that are loaded at run
        # time from beside the executable (<exe_dir>/schemas/process) — nothing
        # about them is compiled in — and the set's skill (how the five are used
        # together) is one more document in the same directory. No test in the
        # build tree can see whether they were installed, because the suite
        # reaches them through the source path CMake baked in, and that path
        # exists in every job here (a release tree reaches them the other way;
        # staged-runtime exercises that). A release that quietly stopped
        # shipping these files would lose all five process tools — or the
        # guidance that says how to use them — at run time with nothing red to
        # show for it, so the packaging is asserted explicitly: five tool
        # declarations and skill.yaml.
        run: |
          set -euo pipefail
          found=$(find stage/bin/schemas/process -maxdepth 1 -name '*.yaml' | wc -l)
          echo "staged declaration files: $found"
          test "$found" -eq 6
          test -f stage/bin/schemas/process/skill.yaml
          test -s stage/bin/schemas/reading/read_text.yaml
          test -s stage/bin/schemas/reading/skill.yaml
          test -s stage/bin/schemas/editing/str_replace_edit.yaml
          test -s stage/bin/schemas/editing/skill.yaml

      - name: Assert the release carries the default role prompt
        run: test -s stage/bin/prompts/coding_agent.yaml

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120

      - name: Pack the build and staging trees
        # tar before upload-artifact: the artifact format does not preserve the
        # executable bit, and a test binary that arrives non-executable fails in
        # the next job for a reason that has nothing to do with portability.
        #
        # The build tree travels along with the staging tree because ctest needs
        # it — CTestTestfile.cmake references absolute paths, and the test
        # executables themselves are deliberately not part of a release install.
        run: tar -czf portable-release.tar.gz build stage
        if: matrix.build_type == 'Release'

      - uses: actions/upload-artifact@v4
        if: matrix.build_type == 'Release'
        with:
          name: portable-release
          path: portable-release.tar.gz
          retention-days: 1

      - name: Confirm the toolchain is the one the image promises
        # Cheap guard against a silent base-image swap: the plugin admission
        # fingerprint hashes the full compiler version, so a different point
        # release here means artifacts from this job stop being loadable
        # against ones built in the other image.
        #
        # `|| true` on the banner: under the pinned shell's -o pipefail, `head`
        # closing the pipe early makes ldd's SIGPIPE the pipeline's status
        # (141), and a log line must not be able to fail the step. The strict
        # check here is the compiler version, which is a test, not a pipeline.
        run: |
          g++-14 -dumpfullversion
          test "$(g++-14 -dumpfullversion)" = "14.3.0"
          ldd --version | head -1 || true

  # ---------------------------------------------------------------------------
  # staged-runtime — run the release on the oldest platforms it claims.
  #
  # Everything above is a static check performed inside the build image, and
  # that image cannot answer the question that actually matters. Two reasons:
  #
  #   1. /usr/local/lib64 is in its ldconfig cache, so the bundled libstdc++ is
  #      found whether or not the artifacts carry a correct RPATH. Copying
  #      libraries next to a binary does nothing on Linux by itself; the loader
  #      never looks beside the executable. A release could ship a complete
  #      runtime and still resolve libstdc++ from the host.
  #   2. Its own OpenSSL is 3.5.x, so no static check there exercises the 3.0.2
  #      that the oldest supported target provides.
  #
  # Both legs take the built artifacts to a stock distro of a target family, each
  # with a libstdc++ OLDER than the GCC 14 one the release bundles (22.04 has
  # GLIBCXX_3.4.30, AlmaLinux 9 has 3.4.29). That is what keeps the test honest:
  # if the $ORIGIN RPATHs are wrong, the binaries do not silently fall back to
  # the host's libstdc++, they fail to load at all. Neither leg can pass by
  # accident.
  #
  # Two legs rather than one, because they are the two halves of the documented
  # target set and they fail for different reasons:
  #
  #   - ubuntu:22.04 — glibc 2.35, OpenSSL 3.0.2. The only leg that exercises
  #     SIMPLEX_OPENSSL_FLOOR: a symbol added after OpenSSL 3.0 binds a node this
  #     libssl does not define, while DT_NEEDED still reads exactly libssl.so.3.
  #   - almalinux:9 — glibc 2.34, i.e. the only leg that actually EXECUTES on the
  #     floor the release is built for (the build image cannot: its own glibc is
  #     2.34 with the same backports, but everything there resolves through
  #     ldconfig). It is also where the exemption in portability_floor.cmake
  #     earns its keep: `_dl_find_object@GLIBC_2.35` exists on this distro only
  #     as a backport into its glibc 2.34, so the bundled libgcc_s that
  #     references it must resolve here. No static scan can show that.
  #
  # Neither image is digest-pinned, unlike the build images. They stand in for
  # "whatever a user's Ubuntu 22.04 / AlmaLinux 9 looks like"; pinning them would
  # freeze the target distro's own security updates out of the test, which is the
  # opposite of what a compatibility target is for.
  # ---------------------------------------------------------------------------
  staged-runtime:
    runs-on: ubuntu-latest
    needs: portable-release
    timeout-minutes: 30
    strategy:
      # Both legs report. A failure on one distro must not hide the other's,
      # since "which family broke" is the first question a red run raises.
      fail-fast: false
      # One matrix value, so the job shows up as "staged-runtime (ubuntu:22.04)".
      # The install commands are chosen from it in the step below rather than
      # carried as a second matrix key, which GitHub would splice into the job
      # name as a multi-line command.
      matrix:
        image: [ubuntu:22.04, almalinux:9]
    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install test prerequisites
        # cmake/ctest to drive the suite, binutils for nm/readelf (the
        # llm_plugin_boundary_hygiene and portability_floor ctests), and NO
        # compiler: installing g++ would drag in a newer libstdc++ and quietly
        # repair the exact failure this job exists to detect.
        #
        # The unknown-image case fails rather than skipping the install: a third
        # leg added without a package rule should be a red run, not a leg that
        # silently tests nothing.
        run: |
          case "${{ matrix.image }}" in
            ubuntu:*)
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                cmake binutils ca-certificates
              ;;
            almalinux:*)
              dnf -y install --setopt=install_weak_deps=False \
                cmake binutils ca-certificates
              ;;
            *)
              echo "no package-manager rule for ${{ matrix.image }}"; exit 1
              ;;
          esac
          ldd --version | head -1 || true
          openssl version

      - uses: actions/download-artifact@v4
        with:
          name: portable-release

      - name: Unpack
        run: tar -xzf portable-release.tar.gz

      - name: Assert the release resolves its OWN runtime, not the host's
        # The core assertion of this job. LD_LIBRARY_PATH is explicitly emptied
        # so nothing but the artifacts' own RUNPATH is in play, then every
        # resolved path for the bundled libraries is required to be inside the
        # staging tree. `ldd -r` also resolves function relocations, so a symbol
        # the target's older libraries cannot supply fails here rather than at
        # first call.
        run: |
          set -euo pipefail
          stage="$PWD/stage"
          fail=0
          n_exe=0
          n_plugin=0
          for f in "$stage"/bin/* "$stage"/bin/plugins/*/*.so; do
            [ -f "$f" ] || continue
            # bin/ also contains editable startup configuration. Inspect ELF
            # magic before running ldd; file(1) is not installed everywhere.
            magic=$(od -An -tx1 -N4 "$f" | tr -d '[:space:]')
            if [ "$magic" != "7f454c46" ]; then
              case "$f" in
                */plugins/*/*)
                  echo "FAIL: plugin is not an ELF file: ${f#$stage/}"
                  fail=1
                  ;;
                *) echo "skip non-ELF resource: ${f#$stage/}" ;;
              esac
              continue
            fi
            case "$f" in
              */plugins/*/*) n_plugin=$((n_plugin + 1)) ;;
              *)               n_exe=$((n_exe + 1)) ;;
            esac
            echo "--- ${f#$stage/}"
            out=$(env -u LD_LIBRARY_PATH ldd -r "$f")
            echo "$out" | grep -E 'libstdc\+\+|libgcc_s|libboost|not found|undefined' || true
            # Bundled runtime must come from the release, not /usr/lib.
            for lib in libstdc++.so.6 libgcc_s.so.1; do
              path=$(echo "$out" | awk -v l="$lib" '$1==l {print $3}')
              case "$path" in
                "$stage"/*) ;;
                *) echo "FAIL: $lib resolved to '${path:-<unresolved>}', not the release"; fail=1 ;;
              esac
            done
            if echo "$out" | grep -qE 'not found|undefined symbol'; then
              echo "FAIL: unresolved symbols or libraries in ${f#$stage/}"; fail=1
            fi
          done
          # Zero matching files is the one way this loop can lie: `fail` stays 0
          # and the step reads as green while asserting nothing at all. Both
          # groups are therefore required to be non-empty, which also catches a
          # release that stopped installing its plugins.
          echo "asserted ${n_exe} executable(s) and ${n_plugin} plugin(s)"
          if [ "$n_exe" -eq 0 ] || [ "$n_plugin" -eq 0 ]; then
            echo "FAIL: nothing staged to assert on"
            fail=1
          fi
          test "$fail" -eq 0

      - name: Run the full test suite against the bundled runtime
        # The build tree's test binaries keep CMake's absolute build RPATH, which
        # points at the project's own libraries but not at the bundled
        # libstdc++/Boost — those live in the staging tree here, not in this
        # container's ldconfig cache. LD_LIBRARY_PATH is the launcher-style half
        # of the strategy, and it is legitimate for tests: the release binaries
        # themselves are covered by the RPATH assertion above, without it.
        run: |
          export LD_LIBRARY_PATH="$PWD/stage/lib"
          ctest --test-dir build --output-on-failure --no-tests=error --timeout 120

      - name: Assert a release binary finds the STAGED tool declarations
        # The last step cannot answer this, and that is the whole reason this one
        # exists: the suite runs from build/, and this job checks the sources out
        # at the SAME absolute path the release was built with — so the tools'
        # YAML declarations are found through that path whether or not the
        # install shipped them. A packaging regression would therefore keep CI
        # green while every real release (which has no source tree) silently lost
        # all five process tools.
        #
        # So: hide the source copy, put a suite in the staged bin/ — the lookup
        # is relative to /proc/self/exe, so that is what makes it read the
        # installed layout — and have it load all five tools from there, along
        # with the set's skill (the third case, which is the same question asked
        # of the document that is not a tool). The trap restores the tree
        # whether the assertion passes or fails.
        run: |
          set -euo pipefail
          sources=tools/intrinsic/toolsets/process/schemas
          mv "$sources" /tmp/schemas-parked
          trap 'mv /tmp/schemas-parked "$sources"' EXIT
          cp build/bin/test_tools stage/bin/
          export LD_LIBRARY_PATH="$PWD/stage/lib"
          stage/bin/test_tools --log_level=error \
            --run_test=the_set_offers_five_routable_tools,every_tool_is_declared_by_its_own_yaml_file,the_set_carries_its_skill_and_hands_it_to_a_prompt

        # The source path baked into the library must not rescue a broken
        # executable-relative lookup. Use the installed test executable and
        # temporarily hide the source declarations, like the process check.
      - name: Assert a release binary finds the STAGED reading declarations
        run: |
          set -euo pipefail
          sources=tools/intrinsic/toolsets/reading/schemas
          parked=$(mktemp -d)
          mv "$sources" "$parked/schemas"
          trap 'mv "$parked/schemas" "$sources"; rmdir "$parked"' EXIT
          cp build/bin/test_reading_tools stage/bin/
          unset SIMPLEX_READING_SCHEMA_DIR
          export LD_LIBRARY_PATH="$PWD/stage/lib"
          stage/bin/test_reading_tools --log_level=error \
            --run_test=defaults_schema_skill_and_attributes_match,installed_declarations_take_precedence_when_present,all_read_modes_preserve_expected_selection

      - name: Assert a release binary finds the STAGED editing declarations
        run: |
          set -euo pipefail
          sources=tools/intrinsic/toolsets/editing/schemas
          parked=$(mktemp -d)
          mv "$sources" "$parked/schemas"
          trap 'mv "$parked/schemas" "$sources"; rmdir "$parked"' EXIT
          cp build/bin/test_editing_tools stage/bin/
          unset SIMPLEX_EDITING_SCHEMA_DIR
          export LD_LIBRARY_PATH="$PWD/stage/lib"
          stage/bin/test_editing_tools --log_level=error \
            --run_test=schema_registration_confirmation_and_aligned_preview,installed_declarations_take_precedence_when_present

      - name: Verify executable-relative default prompt in the installed tree
        run: |
          set -euo pipefail
          test -s stage/bin/prompts/coding_agent.yaml
          cp build/bin/test_load_system_prompt stage/bin/
          export LD_LIBRARY_PATH="$PWD/stage/lib"
          stage/bin/test_load_system_prompt --run_test=default_prompt_is_loaded_beside_the_executable

      - name: Verify installed dynamic toolsets and loop hooks
        run: |
          set -euo pipefail
          cp build/bin/test_tool_extensions build/bin/test_loop_extensions stage/bin/
          export LD_LIBRARY_PATH="$PWD/stage/lib"
          stage/bin/test_tool_extensions --run_test=load_register_execute_and_pin_handle
          stage/bin/test_loop_extensions --run_test=load_register_publish_and_release

  # ---------------------------------------------------------------------------
  # hub-e2e — the hub against the RELEASE worker, and the panel in a browser.
  #
  # It reuses portable-release's artifact rather than building the tree again,
  # which makes the subject of the test the staged layout:
  # stage/bin/simplex_worker finds its plugins, prompts and schemas through
  # executable-relative lookup and its runtime through the release's own $ORIGIN
  # RPATH. Until now the only thing that ran a release binary was ctest's test
  # executables — this is the first real workload, and the first check that a
  # release can serve the hub at all.
  #
  # Not a container job, unlike everything above: the artifact targets glibc
  # >= 2.34 and the runner's is newer, which is the direction that works.
  # Proving the floor is staged-runtime's job; this job is about the hub.
  #
  # What it does not prove: a real provider (the hub's offline mock stands in),
  # wss or a reverse proxy, or any browser other than the one the runner ships.
  # ---------------------------------------------------------------------------
  hub-e2e:
    runs-on: ubuntu-latest
    needs: portable-release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          name: portable-release

      - name: Unpack
        run: tar -xzf portable-release.tar.gz

      - name: Install dependencies
        working-directory: hub
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Assert the release worker starts
        # Before blaming the hub for anything, prove the subject runs: --help
        # links the release's shared libraries through its RPATH but loads no
        # plugin, so this is the packaging half. The end-to-end run below is
        # what loads plugins and executes a tool.
        run: stage/bin/simplex_worker --help

      - name: Assert a browser is available for the panel check
        # An explicit red step rather than a test that quietly skips. A panel
        # check with no browser reads as green while asserting nothing, which is
        # the failure mode this whole workflow is written against. The runner
        # image exports CHROME_BIN; chromium is the fallback.
        run: command -v "${CHROME_BIN:-google-chrome}" || command -v chromium

      - name: End to end
        working-directory: hub
        env:
          # The staged release, not build/: the build tree's binaries carry
          # CMake's absolute build RPATH into paths that do not exist here.
          SIMPLEX_WORKER_BIN: ${{ github.workspace }}/stage/bin/simplex_worker
          SIMPLEX_PROMPTS_DIR: ${{ github.workspace }}/stage/bin/prompts
          # A browser check that cannot find a browser must fail, not skip.
          PANEL_REQUIRE_BROWSER: '1'
        run: npm run test:e2e
