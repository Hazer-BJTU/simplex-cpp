<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="300 120 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Simplex — C++ Agent Harness</title>
  <desc id="desc">Refined vector logo. Blue, graphite and charcoal ribbons have independent curved and bevelled ends, separated by transparent gaps. An upper grey triangle and two lower facets (grey left, blue right) follow the frame edge directions. Transparent margins separate the facets from the frame and each other. Optically spaced wordmark on a common baseline, with a left-aligned subtitle. Transparent background; all lettering is outlined.</desc>
