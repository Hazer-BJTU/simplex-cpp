name: memory_fetch
description: >-
  Read one archived text source identified by memory_search, not a whole snapshot.
  Sources include messages and tool text. Offsets refer to original source bytes.
  Use the search offset to read near a match, or zero to read from the beginning.
  Continue with next_offset while has_more is true. A source can expire between
  calls. Invalid UTF-8 and NUL are replaced only for display; display_replaced
  reports this. Host output limits may shorten a page without skipping bytes.
type: read_only
security: trusted
config:
  timeout_ms: 1000
  max_output_bytes: 32768
argument_schema:
  type: object
  additionalProperties: false
  required: [archive_id, source_id]
  properties:
    archive_id:
      type: string
      minLength: 1
      description: Copy the archive_id returned by memory_search.
    source_id:
      type: string
      minLength: 1
      description: Copy source_id together with its archive_id; never use alone.
    offset:
      type: integer
      minimum: 0
      default: 0
      description: Original zero-based byte offset; must not split a UTF-8 character. EOF returns empty text.
    length:
      type: integer
      minimum: 4
      maximum: 32768
      default: 8192
      description: Maximum original bytes to read; EOF, UTF-8 boundaries and host output budget can shorten it.
