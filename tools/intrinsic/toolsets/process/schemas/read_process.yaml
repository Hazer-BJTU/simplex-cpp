# Model-facing declaration; implemented in src/tools.cpp.
# type/security document C++ attributes; the loader does not configure them.

name: read_process
description: >-
  Read captured stdout and/or stderr for one session, without waiting for
  completion. By default, return output since the last incremental read of each
  selected stream and advance those cursors. poll_process shares these cursors.
  With full: true, return all retained output for the selected streams without
  advancing the cursors. Output may be truncated at the capture limit. An
  unknown or released session_id is an error.

type: read_only
security: trusted

argument_schema:
  type: object
  required: [session_id]
  properties:
    session_id:
      type: string
      minLength: 1
      description: >-
        Session ID returned by spawn_process or run_command.
    stream:
      type: string
      enum: [stdout, stderr, both]
      default: both
      description: >-
        Output streams to read. Default: both. An incremental read advances
        only the selected streams; the other stream remains unread.
    full:
      type: boolean
      default: false
      description: >-
        Return all retained output for the selected streams without advancing
        their incremental cursors. Default: false. Cannot recover output
        discarded because of the capture limit.
    release:
      type: boolean
      default: false
      description: >-
        Remove the session after reading if its child has exited. Default:
        false. A running child is not released; the result reports released:
        false. Output capture need not be complete. After release, the ID is
        invalid and unread or later output cannot be retrieved.
