# Model-facing declaration; implemented in src/tools.cpp.
# type/security document C++ attributes; the loader does not configure them.

name: read_process
description: >-
  Read generic output without waiting. Default reads return new bytes and
  advance the same cursors as poll_process. full: true returns all retained
  output without consuming it. Pipe stderr is labelled; ordering between pipes
  is not reconstructed. Terminal output appears once, including controls.
  Invalid UTF-8 is replaced; a growing incomplete character waits for more bytes.
  Check output_complete and output_truncated. Unknown or released IDs fail.

type: read_only
security: trusted

argument_schema:
  type: object
  required: [session_id]
  properties:
    session_id:
      type: string
      minLength: 1
      description: >-
        Session ID returned by spawn_process or run_command.
    full:
      type: boolean
      default: false
      description: >-
        Return all retained output without advancing
        incremental cursors. Default: false. Cannot recover output
        discarded because of the capture limit.
    release:
      type: boolean
      default: false
      description: >-
        Remove the session after reading if its child has exited. Default:
        false. A running child is not released; the result reports released:
        false. Output capture need not be complete. After release, the ID is
        invalid and unread or later output cannot be retrieved.
