# write_process_input — feed a live child's standard input.
#
# THIS FILE IS THE DECLARATION, and src/tools.cpp is the implementation. See
# tools/intrinsic/tool_declaration.hpp for the format and spawn_process.yaml
# for the full explanation of how the two are kept together.

name: write_process_input
description: >-
  Send text to a running process's standard input. Include the trailing newline
  if the process reads by lines. Pass close_input to signal end-of-input
  afterwards, which is what a process reading until EOF waits for. A call must
  do one or the other: sending nothing and leaving the input open does nothing,
  and is refused.

# READ BY A HUMAN, NOT BY THE LOADER. SerialWrite because what this call
# changes is outside the host — the bytes are the child's next input, so the
# order two writes arrive in is what it reads (and one carrying `close_input`
# can drop the other outright). RequireConfirm: it is input to a live process,
# which can do anything with it.
type: serial_write
security: require_confirm

argument_schema:
  type: object
  required: [session_id]
  properties:
    session_id:
      type: string
      minLength: 1
      description: >-
        The session to write to, as returned by spawn_process
    input:
      type: string
      default: ""
      description: >-
        Text to send, verbatim. Include "\n" if the process reads lines. A call
        must either send something or close the input (see close_input)
    close_input:
      type: boolean
      default: false
      description: >-
        Whether to close standard input after sending, so the process sees
        end-of-input. A call that sends nothing must set this
  # The tool's one cross-property rule, stated the way JSON Schema states one:
  # a call must send something OR close the input. Both properties have
  # defaults, so without this a call naming only session_id would read as valid
  # while the implementation refuses it ("nothing to do"); with it, the
  # declaration and the implementation agree about which calls exist, and
  # test_tools.cpp asserts both halves — each alternative accepted, and the
  # required-only call refused.
  #
  # Note the shape this vocabulary asks for: a branch requires, and may narrow,
  # properties the schema already declares (it cannot introduce one), and at
  # least one of its requirements is one `required` does not already name.
  anyOf:
    - required: [input]
      properties:
        input:
          minLength: 1
    - required: [close_input]
      properties:
        close_input:
          enum: [true]
