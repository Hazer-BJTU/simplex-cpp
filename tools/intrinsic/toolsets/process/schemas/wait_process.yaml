# wait_process — block until one child has exited and its output is complete.
#
# THIS FILE IS THE DECLARATION, and src/tools.cpp is the implementation. See
# tools/intrinsic/tool_declaration.hpp for the format and spawn_process.yaml
# for the full explanation of how the two are kept together.

name: wait_process
description: >-
  Wait for a process to finish and report how it ended, along with everything
  it printed. Returns when the process has exited AND its output capture is
  complete — a child that exits while something it started still holds its
  stdout/stderr open keeps this waiting — or when the timeout runs out. A
  timeout is not an error: the result reports `exited` and `output_complete`
  separately, and the process keeps running.

# READ BY A HUMAN, NOT BY THE LOADER. ReadOnly / Trusted: waiting watches a
# child the host already started and changes nothing outside it. It is the one
# call that can hold a parallel branch open for its whole timeout, which is why
# the timeout defaults to a bounded value rather than to "forever".
type: read_only
security: trusted

argument_schema:
  type: object
  required: [session_id]
  properties:
    session_id:
      type: string
      description: >-
        The session to wait for, as returned by spawn_process
    timeout_milliseconds:
      type: integer
      minimum: 0
      default: 30000
      description: >-
        How long to wait before giving up and reporting the process as still
        running. 0 waits indefinitely, which risks waiting forever on a process
        that never exits
    release:
      type: boolean
      default: false
      description: >-
        Whether to forget the session after it exits and its output has been
        reported
