# Project skill format: tools/intrinsic/skill_declaration.hpp.
# Metadata describes the skill; text is injected verbatim into the prompt.
name: process
title: Running and managing processes
description: >-
  Choose a process launcher, wait for background work, read output, send input
  or termination signals, and release completed sessions.
keywords: [process, subprocess, command, shell, session, stdout, stdin, wait, poll]

text: |
  ## Choose and launch

  - `run_command`: shell syntax (bash if available, otherwise /bin/sh). Only
    `command`, `working_directory`, and `expected_runtime_milliseconds` are
    accepted. It inherits the host environment; use assignments, `export`, or
    `env -i` inside the command to change it. Complete initial results always
    auto-release.
  - `spawn_process`: executable plus literal arguments; no shell quoting,
    expansion, or pipelines. Bare names use PATH; explicit paths never fall back
    to PATH. Relative executable paths resolve against the host directory,
    not the child's `working_directory`. Use its environment options and
    `auto_release: false` when explicit control or retained output is needed.
  - Initial waits default to 3000 ms / 5000 ms respectively; 0 skips waiting.
    Expiration leaves the process running. Exit may add another wait window
    for output draining. These are wait limits, not execution limits.

  ## Inspect, wait, release

  - Metadata uses `[[key]]: value` before literal stdout/stderr. `finished`
    means the child exited during the initial wait; `output_complete` means
    capture ended, not that nothing was truncated. Nonzero exits are results,
    not tool invocation errors.
  - Both launchers auto-release complete initial results after collecting output
    (unless spawn opts out). `released: true` makes the ID unusable. Running
    children or incomplete capture retain their sessions; background completion
    never auto-releases. IDs are valid only in their originating host store.
  - `poll_process` waits up to 30000 ms by default for ANY selected session to
    exit with complete capture, then reports ALL selected sessions. Use positive
    waits, not sleep commands or repeated zero-wait checks. Remove completed IDs
    from later polls to avoid immediate returns. Empty `session_ids` means all
    retained sessions. Unknown IDs are ignored; no matches return immediately.
    `timed_out` can also mean an empty selection or a zero-wait check.
  - Collect needed output, then release retained sessions with `read_process`
    (`release: true`) or `poll_process` (`release_exited: true`). Exited sessions
    still occupy slots. Release requires exit but not complete capture: it
    discards later output and does not terminate descendants holding pipes open.

  ## Read and control

  - `read_process` reads one session without waiting; choose stdout/stderr/both.
    Default reads and polls share and advance per-stream cursors; concurrent
    reads may split output. Poll with `include_output: false` for status only.
    `full: true` and launch-result output do not advance cursors, so later delta
    reads may repeat launch output. Truncated bytes cannot be recovered.
  - `send_process` queues `input`; include a newline for line-oriented programs
    and set `close_input: true` when EOF is needed. Queuing does not prove the
    child read the bytes. Use `signal: "term"` for graceful stopping, then
    `"kill"` if necessary; poll to confirm exit. Signals target only the direct
    child, not descendants. Unknown IDs fail in read/send.
  - Launch/send require the host's confirmation policy. Respect denials; do not
    retry unchanged to bypass them.
