# Model-facing declaration; implemented in src/tools.cpp.
# type/security document C++ attributes; the loader does not configure them.

name: send_process
description: >-
  Queue text for a session's standard input, request its end, and/or send a
  termination signal to the direct child. At least one action is required:
  nonempty input, end_input: true, or signal: term or kill. Input is queued
  before input-end and signalling, but the call does not wait for the child to
  read it or exit. Check signalled when sending a signal, then use poll_process
  to observe completion. The session remains available for output reads. An
  unknown or released session_id is an error; an already exited child cannot
  receive input or signals.

type: serial_write
security: require_confirm

argument_schema:
  type: object
  required: [session_id]
  properties:
    session_id:
      type: string
      minLength: 1
      description: >-
        Session ID returned by spawn_process or run_command.
    input:
      type: string
      default: ""
      description: >-
        Text to queue verbatim for standard input. Default: empty. Include a
        newline ("\n" in JSON) when the program expects a line. Queuing does not
        confirm delivery or consumption by the child.
    end_input:
      type: boolean
      default: false
      description: >-
        Submit queued input and request its end. Pipes close after queued input;
        terminals request EOF only when their current mode supports it, keeping
        output open. Acceptance does not guarantee delivery or program exit.
        poll_process reports input_state (including unsupported or failed).
        Use signal to stop a program that ignores or cannot accept EOF.
    signal:
      type: string
      enum: ["", "term", "kill"]
      default: ""
      description: >-
        Signal for the direct child only: "" sends none, "term" requests
        termination (the child may handle or ignore it), and "kill" forces
        termination. Default: "". Does not signal descendants or wait for exit;
        use poll_process to confirm completion.
  # Require at least one action; session_id alone is not a valid call.
  anyOf:
    - required: [input]
      properties:
        input:
          minLength: 1
    - required: [end_input]
      properties:
        end_input:
          enum: [true]
    - required: [signal]
      properties:
        signal:
          enum: ["term", "kill"]
