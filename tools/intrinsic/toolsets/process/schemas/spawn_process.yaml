# spawn_process — run a program, and wait a while to see if it finishes.
#
# THIS FILE IS THE DECLARATION, and src/tools.cpp is the implementation: the
# name, the description and the argument schema below are everything a model is
# told about this tool, and SpawnProcessTool is what actually validates a call
# and runs it. See tools/intrinsic/tool_declaration.hpp for the format.
#
# The tests pin the two together (test_tools.cpp): every property here must be
# one the implementation validates, every `default` must be the value it
# settles, every clause a property states (its type, enum, minimum, minLength,
# items) must be the rule the implementation applies, every `anyOf` branch must
# be a call it accepts, and the type/security pair below must be the one it
# declares.

name: spawn_process
description: >-
  Run a program. Waits a short while for it to finish, so an ordinary command
  returns its exit code and its whole output in this one call. A program still
  running when that wait runs out keeps running in the background instead, and
  the result carries a session id for it: use poll_process to wait for it to
  finish or to check on it, read_process_output to read what it has printed,
  and send_process to feed it or to end it. Set
  expected_runtime_milliseconds when a command needs longer than the default to
  finish in-call, or 0 to skip the wait and get an id straight away. There is
  no shell - the program is run directly, so pipes, redirections and globs
  reach it as literal arguments; run them through 'sh' with '-c' explicitly if
  that is what you want.

# READ BY A HUMAN, NOT BY THE LOADER. The tool declares this pair in
# write_attributes(); it is restated here so the whole of what a caller can
# observe about this tool is in one place. SerialWrite because launching a
# program changes the machine and two launches in one batch contend for the
# same files; RequireConfirm because this is the call that runs arbitrary code.
type: serial_write
security: require_confirm

argument_schema:
  type: object
  required: [executable]
  properties:
    executable:
      type: string
      minLength: 1
      description: >-
        Program to run: a name resolved through PATH ('grep') or a path
        ('/usr/bin/grep')
    arguments:
      type: array
      items:
        type: string
      # Declared like environment's, because the implementation settles it the
      # same way: a call naming no arguments runs with none, and
      # settle_string_list() puts the empty list in the query the model is
      # shown, so the declaration has to say so (test_tools.cpp holds that in
      # both directions — a settled value the file does not mention is as much
      # a mismatch as a missing one).
      default: []
      description: >-
        Arguments after the program name. Each element is one argument, passed
        verbatim - do not quote or escape them
    description:
      type: string
      default: ""
      description: >-
        Short label for this process, echoed back in every report about it
    working_directory:
      type: string
      # An empty string is refused rather than read as absent (spawn cannot
      # start a child in ""), which is what minLength states. No default on
      # purpose: absent means "inherit the host's working directory", and there
      # is no path that could stand for that.
      minLength: 1
      description: >-
        Directory to start the process in. Defaults to the host's own working
        directory
    environment:
      type: array
      items:
        type: string
      default: []
      # The one rule this file cannot state: an element must be "KEY=VALUE"
      # with a non-empty key, which no keyword in the vocabulary expresses
      # (`items` says only what an element's TYPE is). The implementation owns
      # it (tools.cpp), the description below states it for the model, and
      # test_tools.cpp pins it as an implementation rule the declaration
      # deliberately does not claim.
      description: >-
        Extra environment entries as "KEY=VALUE" strings, merged over the
        inherited environment by key
    inherit_environment:
      type: boolean
      default: true
      description: >-
        Whether the process inherits the host's environment
    expected_runtime_milliseconds:
      type: integer
      minimum: 0
      default: 5000
      description: >-
        How long to wait for the program to finish before letting it continue
        in the background. Raise it for a command expected to take a while but
        still worth waiting for; 0 returns a session id immediately without
        waiting
