# Model-facing declaration; implemented in src/tools.cpp.
# type/security document C++ attributes; the loader does not configure them.

name: spawn_process
description: >-
  Start a program directly, without shell parsing. Each arguments element is
  passed as one literal argument; use run_command for shell syntax. Wait up to
  expected_runtime_milliseconds for the child to exit; expiration leaves it
  running. A successful launch returns a session_id for correlation. If finished is true, the result includes captured output;
  check output_complete and truncation markers before treating it as complete.
  Use poll_process to wait, read_process to read output, and send_process to
  send input or a signal.
  With auto_release (default true), an initially finished child with complete
  output capture is released after collecting its output. Check released before
  using the session_id again; released sessions cannot be read or polled.

type: serial_write
security: require_confirm

argument_schema:
  type: object
  required: [executable]
  properties:
    executable:
      type: string
      minLength: 1
      description: >-
        Bare program name searched through PATH, or an explicit path such as
        ./tool or /usr/bin/grep. Explicit paths never fall back to PATH.
        Relative paths are resolved against the host working directory before
        applying working_directory, which only changes the child's directory.
    arguments:
      type: array
      items:
        type: string
      default: []
      description: >-
        Arguments excluding the program name. Each array element is passed
        verbatim as one argument. Do not add shell quotes or shell escapes; use
        normal JSON escaping when encoding the string.
    description:
      type: string
      default: ""
      description: >-
        Optional label included in session reports.
    working_directory:
      type: string
      minLength: 1
      description: >-
        Directory in which to start the child. Omitted means the host's
        working directory; an empty string is invalid.
    environment:
      type: array
      items:
        type: string
      default: []
      description: >-
        Environment entries as "KEY=VALUE" strings with nonempty keys; values
        may be empty. Default: []. Entries override inherited values by key,
        or supply the environment when inherit_environment is false.
    inherit_environment:
      type: boolean
      default: true
      description: >-
        Inherit the host's environment before applying environment entries.
        Default: true. False starts with only the supplied entries.
    auto_release:
      type: boolean
      default: true
      description: >-
        Release the session after initial completion and complete output capture,
        after copying output into this result. Default: true, including nonzero
        exit codes. False retains it for later reads. No automatic release occurs
        when the initial wait is skipped, expires, or output capture is incomplete;
        those sessions require manual release. Check the returned released flag.
    expected_runtime_milliseconds:
      type: integer
      minimum: 0
      default: 5000
      description: >-
        Initial wait for child exit, in milliseconds. Default: 5000. Zero
        skips this wait. Expiration leaves the child running; this is not an
        execution time limit. After an observed exit, output capture may take
        up to another window of this duration before the call returns.
