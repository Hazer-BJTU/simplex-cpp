# poll_processes — the state of every session (or named ones), with new output.
#
# THIS FILE IS THE DECLARATION, and src/tools.cpp is the implementation. See
# tools/intrinsic/tool_declaration.hpp for the format and spawn_process.yaml
# for the full explanation of how the two are kept together.

name: poll_processes
description: >-
  List the state of the process sessions: which are still running, which have
  exited and with what code, and what each has printed since the last time its
  output was read. This is the call to make when checking on work started
  earlier. Pass session_ids to look at specific sessions, or leave it out for
  all of them.

# READ BY A HUMAN, NOT BY THE LOADER (the tool declares it in
# write_attributes()). ReadOnly for every shape of this call, including the two
# that move this layer's own bookkeeping — consuming each session's new output
# and reaping the exited ones: what InvokeType describes is the effect a call
# has OUTSIDE the host, and the store's strands make the internal state safe to
# overlap. Trusted: looking at what is already running needs no confirmation.
type: read_only
security: trusted

argument_schema:
  type: object
  required: []
  properties:
    session_ids:
      type: array
      items:
        type: string
      default: []
      description: >-
        Sessions to report on. Omit or leave empty for every session
    include_output:
      type: boolean
      default: true
      description: >-
        Whether to include each session's new output since the last read
    release_exited:
      type: boolean
      default: false
      description: >-
        Whether to forget sessions that have exited, after reporting them.
        Their ids stop being valid
