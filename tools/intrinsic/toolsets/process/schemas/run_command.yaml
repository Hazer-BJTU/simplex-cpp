# Model-facing declaration; implemented in src/tools.cpp.
# type/security document C++ attributes; the loader does not configure them.

name: run_command
description: >-
  Start a shell command using bash when available at /bin/bash or
  /usr/bin/bash, otherwise /bin/sh, with -c. The shell interprets quoting,
  pipelines, redirections, variable expansion and globs; supported syntax depends
  on the selected shell. Use spawn_process for a program with literal arguments.
  The shell inherits the host environment with no additional entries; use
  VAR=value command, export, or env -i inside the command to customize it.
  Wait up to expected_runtime_milliseconds for exit; expiration leaves the
  process running. Initial completion with complete capture automatically
  releases the session after copying output into the result, including nonzero
  exits. Check released before reusing the session_id. Skipped/expired waits
  or incomplete capture retain a session for poll_process/read_process/send_process
  and later manual release. Check output_complete and truncation markers.
  Use spawn_process for explicit environment or auto-release controls.

type: serial_write
security: require_confirm

argument_schema:
  type: object
  required: [command]
  properties:
    command:
      type: string
      minLength: 1
      description: >-
        Nonempty command line interpreted by the selected shell, for example
        "printf hello | wc -c". No separate arguments array is used. The command
        line also becomes the session description.
    working_directory:
      type: string
      minLength: 1
      description: >-
        Directory in which to start the child. Omitted means the host's
        working directory; an empty string is invalid.
    expected_runtime_milliseconds:
      type: integer
      minimum: 0
      default: 3000
      description: >-
        Initial wait for child exit, in milliseconds. Default: 3000. Zero
        skips this wait. Expiration leaves the child running; this is not an
        execution time limit. After an observed exit, output capture may take
        up to another window of this duration before the call returns.
