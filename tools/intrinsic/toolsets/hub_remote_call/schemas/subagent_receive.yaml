name: subagent_receive
description: >-
  With no arguments, list direct children. With subagent_id, inspect status and a
  bounded preview of the latest visible reply; this does not wait for completion.
  To read more, provide output_path to export the latest saved primary conversation
  as marked Markdown on this worker host. Running work may not yet be saved.
  Reasoning and tool calls are excluded. Export requires confirmation, an existing
  parent directory and a new file path; existing files are never overwritten.
  Read or search the exported block markers with available file tools. Collect
  required results before stopping the child, which deletes its persistence.
type: read_only
security: trusted
argument_schema:
  type: object
  additionalProperties: false
  properties:
    subagent_id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
      description: Direct child to inspect; omission lists direct children.
    output_path:
      type: string
      minLength: 1
      pattern: '^[^\u0000]+$'
      description: New Markdown file on the parent worker host; relative to its current directory. Requires subagent_id.
  anyOf:
    - required: [subagent_id]
    - required: []
      not: {required: [output_path]}
