name: hub_remote_call
title: Session plan
description: Maintain a Markdown plan visible to the user.
keywords: [plan, progress]
text: |
  Use `plan` for multi-step work: write a short checklist at the start and update
  it at meaningful milestones. `operation: read` retrieves the current plan;
  `operation: replace` requires the complete `markdown` replacement (64 KiB max).
  Read first when unsure of its current contents. Empty markdown clears it and
  hides the plan card. Plans survive new runs, cancellation, compaction and restarts.
  A successful replacement is saved by the hub and is not rolled back by cancellation.
  After a timeout or disconnect, read to confirm the outcome before replacing again.
