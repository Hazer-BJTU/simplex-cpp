[project]
name = "simplex-ptc"
version = "0.1.0"
description = "Independent experimental persistent Monty interpreter for Simplex PTC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-monty==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[project.scripts]
simplex-ptc = "simplex_ptc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
